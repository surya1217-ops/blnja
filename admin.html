<html lang="id">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin - GadgetStore Pro</title>

<style>

*{

    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{

    color:#172033;
}

header{
    background:

        135deg,

        #5ed5ff
    );

    padding:25px;
    text-align:center;

    box-shadow:
    0 5px 20px #0002;
}

header h1{
    font-size:30px;
}

header p{
    margin-top:7px;
}

.container{
    width:92%;
    max-width:1250px;
    margin:25px auto;
}

.card{
    background:white;
    border-radius:18px;
    padding:25px;
    margin-bottom:25px;

    border:1px solid #d8edff;

    box-shadow:
    0 8px 25px #0878c522;
}

h2{
    color:#075da8;
    margin-bottom:20px;
}

input,
textarea,
select{

    width:100%;

    padding:13px;

    border:1px solid #cbd5e1;

    border-radius:10px;

    margin:7px 0 15px;

    outline:none;

}

input:focus,
textarea:focus,
select:focus{

    border-color:#0878d1;

}

textarea{
    min-height:110px;
    resize:vertical;
}

button{

    border:0;

    padding:12px 18px;

    border-radius:10px;

    cursor:pointer;

    font-weight:bold;

    color:white;

    margin:3px;

}

button:hover{
    transform:translateY(-2px);
}

.blue{
    background:#0878d1;
}

.green{
    background:#08a66a;
}

.red{
    background:#ef4444;
}

.orange{
    background:#f59e0b;
}

.dark{
    background:#475569;
}

.product-grid{

    display:grid;

    grid-template-columns:
    repeat(
        2,
        minmax(0,1fr)
    );

    gap:20px;

}

.product{

    border:1px solid #d9ecfa;

    border-radius:15px;

    overflow:hidden;

    background:white;

}

.product img{

    width:100%;

    height:220px;

    object-fit:cover;

    display:block;

    background:#e5f4ff;

}

.product-body{
    padding:16px;
}

.product-body h3{
    margin-bottom:8px;
}

.price{

    color:#0878d1;

    font-size:20px;

    font-weight:bold;

    margin:8px 0;

}

.stock{

    display:inline-block;

    padding:5px 10px;

    border-radius:7px;

    background:#dcfce7;

    color:#15803d;

    font-size:12px;

    font-weight:bold;

}

.stock.empty{

    background:#fee2e2;

    color:#b91c1c;

}

.desc{

    color:#64748b;

    line-height:1.5;

    margin:10px 0;

}

.product video{

    width:100%;

    margin-top:10px;

    border-radius:8px;

    background:#000;

}

.order{

    border:1px solid #dcebf5;

    border-radius:15px;

    padding:18px;

    margin:12px 0;

    background:#fbfdff;

}

.order h3{

    color:#075da8;

    margin-bottom:10px;

}

.order p{
    margin:7px 0;
}

.status{

    display:inline-block;

    padding:7px 12px;

    border-radius:20px;

    font-weight:bold;

    font-size:13px;

}

.status1{
    background:#fff7ed;
    color:#c2410c;
}

.status2{
    background:#dcfce7;
    color:#15803d;
}

.status3{
    background:#dbeafe;
    color:#1d4ed8;
}

.status4{
    background:#ede9fe;
    color:#6d28d9;
}

.status5{
    background:#cffafe;
    color:#0e7490;
}

.tracking{

    display:flex;

    align-items:center;

    margin:20px 0;

    overflow-x:auto;

}

.step{

    text-align:center;

    min-width:80px;

    color:#94a3b8;

}

.circle{

    width:40px;

    height:40px;

    margin:auto;

    border-radius:50%;

    background:#e2e8f0;

    display:flex;

    align-items:center;

    justify-content:center;

}

.step.active{

    color:#0878d1;

    font-weight:bold;

}

.step.active .circle{

    background:#0878d1;

    color:white;

}

.step.done{

    color:#08a66a;

    font-weight:bold;

}

.step.done .circle{

    background:#08a66a;

    color:white;

}

.line{

    height:4px;

    background:#e2e8f0;

    width:60px;

    flex-shrink:0;

}

.line.done{
    background:#08a66a;
}

.empty{

    text-align:center;

    padding:30px;

    color:#64748b;

}

.hidden{
    display:none!important;
}

.upload{

    border:2px dashed #9bd5f5;

    background:#f4fbff;

    padding:18px;

    border-radius:12px;

    margin-bottom:15px;

}

.upload label{

    font-weight:bold;

    color:#075da8;

    display:block;

    margin-bottom:8px;

}

.preview{

    display:none;

    max-width:300px;

    max-height:220px;

    margin-top:12px;

    border-radius:10px;

}

.file-info{

    color:#64748b;

    font-size:13px;

    margin-top:5px;

}

.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;

}

.login-admin{

    margin:50px auto;

}

footer{

    text-align:center;

    padding:25px;

}

@media(max-width:700px){

    .product-grid{
        grid-template-columns:1fr;
    }

        font-size:24px;
    }

<script>

/* =====================================================
LOGIN ADMIN
===================================================== */

const role =
localStorage.getItem(
    "gadgetCurrentRole"
);

const user =
localStorage.getItem(
    "gadgetCurrentUser"
);


/*
   Admin hanya bisa masuk jika
   username admin dan password 12345
   sudah login melalui index.html.
*/

if(
    role!=="admin" ||
    user!=="admin"
){

    .getElementById(
        "adminPage"

                id="adminPassword"

                style="width:100%"
                onclick="adminLogin()">

                🔐 Login Admin

            </button>

        </div>
    `;

}


/* =====================================================
DATABASE
===================================================== */

const DB_NAME =
    "GadgetStoreProDB";

const DB_VERSION=1;

let db;


/* =====================================================
OPEN DATABASE
===================================================== */

function openDatabase(){

    return new Promise(
        (resolve,reject)=>{

            const request =
                indexedDB.open(
                    DB_NAME,
                    DB_VERSION
                );

            request.onupgradeneeded =
            function(e){

                db=e.target.result;

                if(
                    !db.objectStoreNames
                    .contains("products")
                ){

                    db.createObjectStore(
                        "products",
                        {
                            keyPath:"id"
                        }
                    );

                }

                if(
                    !db.objectStoreNames
                    .contains("orders")
                ){

                    db.createObjectStore(
                        "orders",
                        {
                            keyPath:"id"
                        }
                    );

                }

                if(
                    !db.objectStoreNames
                    .contains("users")
                ){

                    db.createObjectStore(
                        "users",
                        {
                            keyPath:"username"
                        }
                    );

                }

            };

            request.onsuccess=
            function(e){

                db=e.target.result;

                resolve(db);

            };

            request.onerror=
            function(){

                reject(
                    request.error
                );

            };

        }
    );

}


/* =====================================================
GET ALL
===================================================== */

function getAll(storeName){

    return new Promise(
        (resolve,reject)=>{

            const tx =
                db.transaction(
                    storeName,
                    "readonly"
                );

            const store =
                tx.objectStore(
                    storeName
                );

            const request =
                store.getAll();

            request.onsuccess=()=>{
                resolve(
                    request.result
                );
            };

            request.onerror=()=>{
                reject(
                    request.error
                );
            };

        }
    );

}


/* =====================================================
PUT
===================================================== */

function putData(
    storeName,
    data
){

    return new Promise(
        (resolve,reject)=>{

            const tx =
                db.transaction(
                    storeName,
                    "readwrite"
                );

            const request =
                tx
                .objectStore(
                    storeName
                )
                .put(data);

            request.onsuccess=()=>{
                resolve();
            };

            request.onerror=()=>{
                reject(
                    request.error
                );
            };

        }
    );

}


/* =====================================================
DELETE
===================================================== */

function deleteData(
    storeName,
    id
){

    return new Promise(
        (resolve,reject)=>{

            const tx =
                db.transaction(
                    storeName,
                    "readwrite"
                );

            const request =
                tx
                .objectStore(
                    storeName
                )
                .delete(id);

            request.onsuccess=()=>{
                resolve();
            };

            request.onerror=()=>{
                reject(
                    request.error
                );
            };

        }
    );

}


/* =====================================================
RUPIAH
===================================================== */

function rupiah(number){

    return new Intl.NumberFormat(
        "id-ID",
        {
            style:"currency",
            currency:"IDR",
            maximumFractionDigits:0
        }
    ).format(number);

}


/* =====================================================
FILE TO DATA URL
===================================================== */

function fileToDataURL(file){

    return new Promise(
        (resolve,reject)=>{

            const reader =
                new FileReader();

            reader.onload=()=>{
                resolve(
                    reader.result
                );
            };

            reader.onerror=()=>{
                reject(
                    reader.error
                );
            };

            reader.readAsDataURL(file);

        }
    );

}


/* =====================================================
UKURAN FILE
===================================================== */

function formatSize(bytes){

    if(bytes<1024)
        return bytes+" B";

    if(bytes<1024*1024)
        return(
            (bytes/1024)
            .toFixed(1)
            +" KB"
        );

    if(bytes<1024*1024*1024)
        return(
            (bytes/
            (1024*1024))
            .toFixed(1)
            +" MB"
        );

    return(
        (bytes/
        (1024*1024*1024))
        .toFixed(1)
        +" GB"
    );

}


/* =====================================================
PREVIEW FOTO
===================================================== */

document
.getElementById("productImage")
.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file)return;

        document
        .getElementById(
            "imageInfo"
        )
        .textContent =
            file.name+
            " ("+
            formatSize(file.size)+
            ")";

        const url =
            URL.createObjectURL(
                file
            );

        const preview =
            document
            .getElementById(
                "imagePreview"
            );

        preview.src=url;

        preview.style.display=
            "block";

    }
);


/* =====================================================
PREVIEW VIDEO
===================================================== */

document
.getElementById("productVideo")
.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file)return;

        document
        .getElementById(
            "videoInfo"
        )
        .textContent =
            file.name+
            " ("+
            formatSize(file.size)+
            ")";

        const url =
            URL.createObjectURL(
                file
            );

        const preview =
            document
            .getElementById(
                "videoPreview"
            );

        preview.src=url;

        preview.style.display=
            "block";

    }
);


/* =====================================================
EDITING
===================================================== */

let editingId=null;


/* =====================================================
SUBMIT PRODUK
===================================================== */

document
.getElementById("productForm")
.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();

        const name =
            document
            .getElementById(
                "productName"
            )
            .value
            .trim();

        const price =
            Number(
                document
                .getElementById(
                    "productPrice"
                )
                .value
            );

        const stock =
            Number(
                document
                .getElementById(
                    "productStock"
                )
                .value
            );

        const desc =
            document
            .getElementById(
                "productDesc"
            )
            .value
            .trim();

        const imageFile =
            document
            .getElementById(
                "productImage"
            )
            .files[0];

        const videoFile =
            document
            .getElementById(
                "productVideo"
            )
            .files[0];


        if(!editingId && !imageFile){

            alert(
                "Foto produk wajib dipilih!"
            );

            return;

        }


        try{

            let products =
                await getAll(
                    "products"
                );


            /* =========================
               EDIT
            ========================= */

            if(editingId){

                const product =
                    products.find(
                        p=>
                        p.id===editingId
                    );

                if(!product){

                    alert(
                        "Produk tidak ditemukan!"
                    );

                    return;

                }


                let image =
                    product.image;

                let video =
                    product.video || "";


                if(imageFile){

                    image =
                        await fileToDataURL(
                            imageFile
                        );

                }


                if(videoFile){

                    video =
                        await fileToDataURL(
                            videoFile
                        );

                }


                product.name=name;

                product.price=price;

                product.stock=stock;

                product.desc=desc;

                product.image=image;

                product.video=video;


                await putData(
                    "products",
                    product
                );


                alert(
                    "Produk berhasil diperbarui!"
                );

            }


            /* =========================
               TAMBAH
            ========================= */

            else{

                let image =
                    await fileToDataURL(
                        imageFile
                    );

                let video="";


                if(videoFile){

                    video =
                        await fileToDataURL(
                            videoFile
                        );

                }


                const product={

                    id:Date.now(),

                    name:name,

                    price:price,

                    stock:stock,

                    desc:desc,

                    image:image,

                    video:video

                };


                await putData(
                    "products",
                    product
                );


                alert(
                    "Produk berhasil ditambahkan!"
                );

            }


            resetForm();

            await renderProducts();


        }catch(error){

            console.error(error);

            alert(
                "Terjadi kesalahan saat menyimpan produk:\n\n"+
                error.message
            );

        }

    }
);


/* =====================================================
RENDER PRODUCTS
===================================================== */

async function renderProducts(){

    const container =
        document.getElementById(
            "productList"
        );

    const products =
        await getAll(
            "products"
        );

    if(products.length===0){

        container.innerHTML=`

            <div class="empty">

                📦 Belum ada produk.

            </div>

        `;

        return;

    }


    container.innerHTML =
        products
        .map(
            product=>`

            <div class="product">

                ${
                    product.image
                    ?
                    `
                    <img
                        src="${product.image}"
                        alt="Produk">
                    `
                    :
                    `
                    <div
                    style="
                    height:220px;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    font-size:50px;
                    background:#e5f4ff;
                    ">
                        📱
                    </div>
                    `
                }


                <div class="product-body">

                    <h3>
                        ${escapeHTML(
                            product.name
                        )}
                    </h3>

                    <div class="price">
                        ${rupiah(
                            product.price
                        )}
                    </div>

                    <span class="
                    stock
                    ${
                        product.stock<=0
                        ?
                        "empty"
                        :
                        ""
                    }">

                        ${
                            product.stock>0
                            ?
                            "Stok: "+
                            product.stock
                            :
                            "Stok Habis"
                        }

                    </span>

                    <p class="desc">
                        ${escapeHTML(
                            product.desc
                        )}
                    </p>


                    ${
                        product.video
                        ?
                        `
                        <video controls>
                            <source
                                src="${product.video}">
                        </video>
                        `
                        :
                        ""
                    }


                    <br>


                    <button
                        class="orange"
                        onclick="
                        editProduct(
                            ${product.id}
                        )">

                        ✏️ Edit

                    </button>


                    <button
                        class="red"
                        onclick="
                        deleteProduct(
                            ${product.id}
                        )">

                        🗑️ Hapus

                    </button>

                </div>

            </div>

            `
        )
        .join("");

}


/* =====================================================
ESCAPE
===================================================== */

function escapeHTML(text){

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text || "";

    return div.innerHTML;

}


/* =====================================================
EDIT PRODUCT
===================================================== */

async function editProduct(id){

    const products =
        await getAll(
            "products"
        );

    const product =
        products.find(
            p=>p.id===id
        );

    if(!product)return;


    editingId=id;


    document
    .getElementById(
        "productName"
    )
    .value=
        product.name;


    document
    .getElementById(
        "productPrice"
    )
    .value=
        product.price;


    document
    .getElementById(
        "productStock"
    )
    .value=
        product.stock;


    document
    .getElementById(
        "productDesc"
    )
    .value=
        product.desc;


    document
    .getElementById(
        "productImage"
    )
    .removeAttribute(
        "required"
    );


    document
    .getElementById(
        "formTitle"
    )
    .textContent=
        "✏️ Edit Produk";


    document
    .getElementById(
        "cancelButton"
    )
    .classList.remove(
        "hidden"
    );


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* =====================================================
DELETE PRODUCT
===================================================== */

async function deleteProduct(id){

    if(
        !confirm(
            "Yakin ingin menghapus produk?"
        )
    ){

        return;

    }


    try{

        await deleteData(
            "products",
            id
        );

        await renderProducts();

        alert(
            "Produk berhasil dihapus!"
        );

    }catch(error){

        alert(
            "Gagal menghapus produk."
        );

    }

}


/* =====================================================
RESET FORM
===================================================== */

function resetForm(){

    editingId=null;

    document
    .getElementById(
        "productForm"
    )
    .reset();


    document
    .getElementById(
        "productImage"
    )
    .setAttribute(
        "required",
        ""
    );


    document
    .getElementById(
        "formTitle"
    )
    .textContent=
        "➕ Tambah Produk";


    document
    .getElementById(
        "cancelButton"
    )
    .classList.add(
        "hidden"
    );


    document
    .getElementById(
        "imagePreview"
    )
    .style.display=
        "none";


    document
    .getElementById(
        "videoPreview"
    )
    .style.display=
        "none";


    document
    .getElementById(
        "imageInfo"
    )
    .textContent="";


    document
    .getElementById(
        "videoInfo"
    )
    .textContent="";

}


/* =====================================================
CANCEL
===================================================== */

function cancelEdit(){

    resetForm();

}


/* =====================================================
STATUS
===================================================== */

const statuses=[

    "Belum Dibayar",

    "Sudah Dibayar",

    "Sedang Dikemas",

    "Sudah Dikirim",

    "Selesai"

];


/* =====================================================
STATUS NUMBER
===================================================== */

function statusNumber(status){

    const map={

        "Belum Dibayar":1,

        "Sudah Dibayar":2,

        "Sedang Dikemas":3,

        "Sudah Dikirim":4,

        "Selesai":5

    };

    return map[status] || 1;

}


/* =====================================================
STATUS CLASS
===================================================== */

function statusClass(status){

    return "status"+
        statusNumber(status);

}


/* =====================================================
RENDER ORDERS
===================================================== */

async function renderOrders(){

    const container =
        document.getElementById(
            "orderList"
        );

    const orders =
        await getAll(
            "orders"
        );

    if(orders.length===0){

        container.innerHTML=`

            <div class="empty">

                📦 Belum ada pesanan.

            </div>

        `;

        return;

    }


    orders.sort(
        (a,b)=>b.id-a.id
    );


    container.innerHTML =
        orders.map(
            order=>{

                const current =
                    statusNumber(
                        order.status
                    );

                return `

                <div class="order">

                    <h3>
                        📦 ${escapeHTML(
                            order.productName
                        )}
                    </h3>

                    <p>
                        <b>Customer:</b>
                        ${escapeHTML(
                            order.customer
                        )}
                    </p>

                    <p>
                        <b>Jumlah:</b>
                        ${order.quantity}
                    </p>

                    <p>
                        <b>Harga:</b>
                        ${rupiah(
                            order.price
                        )}
                    </p>

                    <p>
                        <b>Total:</b>
                        ${rupiah(
                            order.total
                        )}
                    </p>

                    <p>
                        <b>Pembayaran:</b>
                        ${escapeHTML(
                            order.payment
                        )}
                    </p>

                    <p>
                        <b>Tanggal:</b>
                        ${escapeHTML(
                            order.date
                        )}
                    </p>

                    <p>

                        <b>Status:</b>

                        <span class="
                        status
                        ${statusClass(
                            order.status
                        )}">

                            ${getIcon(
                                order.status
                            )}

                            ${escapeHTML(
                                order.status
                            )}

                        </span>

                    </p>


                    <div class="tracking">

                        ${trackingStep(
                            1,
                            current,
                            "💰",
                            "Belum<br>Dibayar"
                        )}

                        <div class="
                        line
                        ${
                            current>=2
                            ?"done":""
                        }"></div>

                        ${trackingStep(
                            2,
                            current,
                            "✅",
                            "Sudah<br>Dibayar"
                        )}

                        <div class="
                        line
                        ${
                            current>=3
                            ?"done":""
                        }"></div>

                        ${trackingStep(
                            3,
                            current,
                            "📦",
                            "Sedang<br>Dikemas"
                        )}

                        <div class="
                        line
                        ${
                            current>=4
                            ?"done":""
                        }"></div>

                        ${trackingStep(
                            4,
                            current,
                            "🚚",
                            "Sudah<br>Dikirim"
                        )}

                        <div class="
                        line
                        ${
                            current>=5
                            ?"done":""
                        }"></div>

                        ${trackingStep(
                            5,
                            current,
                            "🏠",
                            "Selesai"
                        )}

                    </div>


                    <label>
                        <b>
                            Ubah Status Pesanan
                        </b>
                    </label>


                    <select
                        onchange="
                        changeStatus(
                            ${order.id},
                            this.value
                        )">

                        ${
                            statuses
                            .map(
                                status=>`

                                <option
                                    value="${status}"
                                    ${
                                        status===
                                        order.status
                                        ?
                                        "selected"
                                        :
                                        ""
                                    }>

                                    ${status}

                                </option>

                                `
                            )
                            .join("")
                        }

                    </select>

                </div>

                `;

            }
        ).join("");

}


/* =====================================================
TRACKING
===================================================== */

function trackingStep(
    step,
    current,
    icon,
    text
){

    let cls="";

    if(step<current){

        cls="done";

    }else if(step===current){

        cls="active";

    }

    return `

        <div class="
        step
        ${cls}">

            <div class="circle">
                ${icon}
            </div>

            <small>
                ${text}
            </small>

        </div>

    `;

}


/* =====================================================
ICON
===================================================== */

function getIcon(status){

    if(status==="Sudah Dibayar")
        return "✅";

    if(status==="Sedang Dikemas")
        return "📦";

    if(status==="Sudah Dikirim")
        return "🚚";

    if(status==="Selesai")
        return "🏠";

    return "💰";

}


/* =====================================================
CHANGE STATUS
===================================================== */

async function changeStatus(
    id,
    status
){

    const orders =
        await getAll(
            "orders"
        );

    const order =
        orders.find(
            o=>o.id===id
        );

    if(!order)return;


    order.status=status;


    await putData(
        "orders",
        order
    );


    await renderOrders();


    alert(
        "Status pesanan berhasil diubah menjadi:\n\n"+
        status
    );

}


/* =====================================================
ADMIN LOGIN
===================================================== */

function adminLogin(){

    const username =
        document
        .getElementById(
            "adminUsername"
        )
        .value
        .trim();

    const password =
        document
        .getElementById(
            "adminPassword"
        )
        .value;


    if(
        username==="admin" &&
        password==="12345"
    ){

        localStorage.setItem(
            "gadgetCurrentUser",
            "admin"
        );

        localStorage.setItem(
            "gadgetCurrentRole",
            "admin"
        );

        location.reload();

    }else{

        alert(
            "Username atau password admin salah!"
        );

    }

}


/* =====================================================
LOGOUT ADMIN
===================================================== */

function logoutAdmin(){

    localStorage.removeItem(
        "gadgetCurrentUser"
    );

    localStorage.removeItem(
        "gadgetCurrentRole"
    );

    location.href=
        "index.html";

}


/* =====================================================
INIT
===================================================== */

async function init(){

    try{

        await openDatabase();

        /*
          Jangan render halaman admin
          kalau belum login admin.
        */

        if(
            localStorage.getItem(
                "gadgetCurrentRole"
            )!=="admin"
        ){

            return;

        }

        await renderProducts();

        await renderOrders();

    }catch(error){

        console.error(error);

        alert(
            "Database gagal dibuka:\n"+
            error.message
        );

    }

}

init();

</script>
