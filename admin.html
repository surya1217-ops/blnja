<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Toko Kyy</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --orange-main: #f97316;
      --orange-hover: #ea580c;
      --bg-dark: #0f172a;
      --card-dark: #1e293b;
      --border-dark: #334155;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-light); padding: 12px; line-height: 1.5; }
    
    /* Box Form Login */
    .login-container {
      max-width: 360px;
      margin: 60px auto;
      background: var(--card-dark);
      border: 1px solid var(--border-dark);
      border-radius: var(--radius);
      padding: 20px;
    }
    .login-header { text-align: center; margin-bottom: 16px; }
    .login-header h2 { color: var(--orange-main); font-size: 18px; margin-top: 6px; }

    /* Dashboard Admin Container */
    .container { max-width: 900px; margin: 0 auto; display: none; }
    
    .top-nav {
      background: var(--card-dark);
      border: 1px solid var(--border-dark);
      border-radius: var(--radius);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .brand-logo { color: var(--orange-main); font-weight: 700; text-decoration: none; font-size: 16px; }
    .nav-actions { display: flex; gap: 8px; }
    .btn-nav { background: var(--bg-dark); color: var(--text-light); border: 1px solid var(--border-dark); padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: 600; cursor: pointer; }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: var(--card-dark);
      border: 1px solid var(--border-dark);
      border-radius: var(--radius);
      padding: 12px;
      text-align: center;
    }
    .stat-title { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
    .stat-val { font-size: 16px; font-weight: 700; color: var(--orange-main); }

    /* Form & Cards */
    .card {
      background: var(--card-dark);
      border: 1px solid var(--border-dark);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
    }
    .card-title { font-size: 14px; font-weight: 700; color: var(--orange-main); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-group { margin-bottom: 10px; }
    .form-group.full { grid-column: span 2; }
    .form-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
    .form-group input, .form-group select {
      width: 100%;
      background: var(--bg-dark);
      border: 1px solid var(--border-dark);
      color: white;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
    }
    .btn-submit {
      width: 100%;
      background: var(--orange-main);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-submit:hover { background: var(--orange-hover); }

    /* Table */
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
    th, td { border: 1px solid var(--border-dark); padding: 8px 10px; }
    th { background: var(--bg-dark); color: var(--text-muted); }
    
    .btn-danger { background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
    .badge-pay { background: #0284c7; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; }
  </style>
</head>
<body>

  <!-- FORM LOGIN ADMIN -->
  <div class="login-container" id="loginBox">
    <div class="login-header">
      <i class="fa-solid fa-user-shield" style="font-size: 32px; color: var(--orange-main);"></i>
      <h2>Login Admin Toko</h2>
    </div>
    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="adminUser" placeholder="Masukkan username" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="adminPass" placeholder="Masukkan password" required>
      </div>
      <button type="submit" class="btn-submit" style="margin-top: 6px;"><i class="fa-solid fa-right-to-bracket"></i> Masuk Admin</button>
    </form>
    <div style="text-align: center; margin-top: 12px;">
      <a href="index.html" style="color: var(--text-muted); font-size: 11px; text-decoration: none;"><i class="fa-solid fa-arrow-left"></i> Kembali ke Toko</a>
    </div>
  </div>

  <!-- DASHBOARD PANEL ADMIN -->
  <div class="container" id="adminDashboard">
    <div class="top-nav">
      <a href="#" class="brand-logo"><i class="fa-solid fa-user-gear"></i> Panel Admin Toko</a>
      <div class="nav-actions">
        <a href="index.html" class="btn-nav"><i class="fa-solid fa-store"></i> Ke Toko</a>
        <button class="btn-nav" onclick="handleLogout()" style="border-color:#ef4444; color:#ef4444;"><i class="fa-solid fa-power-off"></i> Keluar</button>
      </div>
    </div>

    <!-- Ringkasan Statistik -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-title">Total Produk</div>
        <div class="stat-val" id="totalProdCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Total Pesanan</div>
        <div class="stat-val" id="totalOrdersCount" style="color:white;">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Pendapatan</div>
        <div class="stat-val" id="totalIncome">Rp 0</div>
      </div>
    </div>

    <!-- Form Tambah Produk Baru -->
    <div class="card">
      <div class="card-title"><i class="fa-solid fa-box-open"></i> Tambah Produk Baru</div>
      <form id="productForm" onsubmit="saveProduct(event)">
        <div class="form-grid">
          <div class="form-group full">
            <label>Nama Produk</label>
            <input type="text" id="prodName" placeholder="Contoh: Kemeja Oversize" required>
          </div>
          <div class="form-group">
            <label>Harga (Rp)</label>
            <input type="number" id="prodPrice" placeholder="150000" required>
          </div>
          <div class="form-group">
            <label>Stok Barang</label>
            <input type="number" id="prodStock" placeholder="20" required>
          </div>
          <div class="form-group">
            <label>Kategori</label>
            <select id="prodCategory">
              <option value="Fashion">Fashion</option>
              <option value="Elektronik">Elektronik</option>
              <option value="Rumah">Rumah</option>
              <option value="Aksesoris">Aksesoris</option>
            </select>
          </div>
          <div class="form-group">
            <label>URL Gambar Produk</label>
            <input type="text" id="prodImg" placeholder="https://..." required>
          </div>
        </div>
        <button type="submit" class="btn-submit"><i class="fa-solid fa-plus"></i> Simpan Produk Baru</button>
      </form>
    </div>

    <!-- Kelola Stok & Daftar Produk -->
    <div class="card">
      <div class="card-title"><i class="fa-solid fa-boxes-stacked"></i> Kelola Katalog & Stok Barang</div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Gambar</th>
              <th>Produk</th>
              <th>Harga</th>
              <th>Stok</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="productListBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Laporan Pesanan Masuk -->
    <div class="card">
      <div class="card-title">
        <span><i class="fa-solid fa-file-invoice-dollar"></i> Laporan Pesanan Masuk</span>
        <button class="btn-danger" onclick="clearAllOrders()"><i class="fa-solid fa-trash"></i> Hapus Laporan</button>
      </div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>ID & Tgl</th>
              <th>Pemesan</th>
              <th>Detail Items</th>
              <th>Bayar</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="orderTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Kredensial Akses Admin
    const ADMIN_USER = "admin";
    const ADMIN_PASS = "12345";

    let products = JSON.parse(localStorage.getItem("kyy_products")) || [
      { id: 1, name: "Kemeja Casual Oversize Kyy", price: 95000, stock: 15, kategori: "Fashion", img: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=400" },
      { id: 2, name: "Sepatu Sneaker Sport Pro", price: 165000, stock: 8, kategori: "Fashion", img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400" }
    ];

    document.addEventListener("DOMContentLoaded", () => {
      checkLoginSession();
    });

    // --- SISTEM AUTENTIKASI ---
    function checkLoginSession() {
      let isLoggedIn = sessionStorage.getItem("kyy_admin_logged");
      if (isLoggedIn === "true") {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("adminDashboard").style.display = "block";
        renderProducts();
        renderOrdersReport();
      } else {
        document.getElementById("loginBox").style.display = "block";
        document.getElementById("adminDashboard").style.display = "none";
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      let user = document.getElementById("adminUser").value.trim();
      let pass = document.getElementById("adminPass").value.trim();

      if (user === ADMIN_USER && pass === ADMIN_PASS) {
        sessionStorage.setItem("kyy_admin_logged", "true");
        checkLoginSession();
      } else {
        alert("Username atau Password salah!");
      }
    }

    function handleLogout() {
      sessionStorage.removeItem("kyy_admin_logged");
      checkLoginSession();
    }

    // --- MANAJEMEN PRODUK & STOK ---
    function renderProducts() {
      let tbody = document.getElementById("productListBody");
      document.getElementById("totalProdCount").innerText = products.length;

      if (products.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--text-muted); padding:16px;">Belum ada produk tersimpan.</td></tr>`;
        return;
      }

      tbody.innerHTML = products.map(p => `
        <tr>
          <td style="text-align:center;">
            <img src="${p.img}" style="width:40px; height:40px; object-fit:cover; border-radius:4px;" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400'">
          </td>
          <td><b>${p.name}</b><br><small style="color:var(--text-muted);">${p.kategori}</small></td>
          <td style="color:var(--orange-main); font-weight:700;">Rp ${Number(p.price).toLocaleString('id-ID')}</td>
          <td style="font-weight:700;">${p.stock || 0} pcs</td>
          <td>
            <button class="btn-danger" onclick="deleteProduct(${p.id})"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
      `).join('');
    }

    function saveProduct(e) {
      e.preventDefault();
      let name = document.getElementById("prodName").value.trim();
      let price = Number(document.getElementById("prodPrice").value);
      let stock = Number(document.getElementById("prodStock").value);
      let kategori = document.getElementById("prodCategory").value;
      let img = document.getElementById("prodImg").value.trim();

      let newProduct = { id: Date.now(), name, price, stock, kategori, img };
      products.push(newProduct);
      
      localStorage.setItem("kyy_products", JSON.stringify(products));
      renderProducts();
      document.getElementById("productForm").reset();
      alert("Produk baru berhasil ditambahkan!");
    }

    function deleteProduct(id) {
      if (confirm("Apakah Anda yakin ingin menghapus produk ini?")) {
        products = products.filter(p => p.id !== id);
        localStorage.setItem("kyy_products", JSON.stringify(products));
        renderProducts();
      }
    }

    // --- MANAJEMEN LAPORAN PESANAN ---
    function renderOrdersReport() {
      let orders = JSON.parse(localStorage.getItem("kyy_orders")) || [];
      let tbody = document.getElementById("orderTableBody");
      let totalIncome = 0;

      if (orders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--text-muted); padding:16px;">Belum ada pesanan masuk.</td></tr>`;
        document.getElementById("totalIncome").innerText = "Rp 0";
        document.getElementById("totalOrdersCount").innerText = "0";
        return;
      }

      tbody.innerHTML = orders.map(ord => {
        totalIncome += ord.total;
        let itemsList = ord.items.map(item => `- ${item.name} (${item.qty}x)`).join('<br>');

        return `
          <tr>
            <td><b>${ord.id}</b><br><small style="color:var(--text-muted);">${ord.date}</small></td>
            <td><b>${ord.name}</b><br><small style="color:var(--text-muted);">${ord.address}</small></td>
            <td>${itemsList}</td>
            <td><span class="badge-pay">${ord.payment}</span></td>
            <td style="font-weight:700; color:var(--orange-main);">Rp ${ord.total.toLocaleString('id-ID')}</td>
          </tr>
        `;
      }).join('');

      document.getElementById("totalIncome").innerText = `Rp ${totalIncome.toLocaleString('id-ID')}`;
      document.getElementById("totalOrdersCount").innerText = orders.length;
    }

    function clearAllOrders() {
      if (confirm("Hapus seluruh riwayat laporan pesanan?")) {
        localStorage.removeItem("kyy_orders");
        renderOrdersReport();
      }
    }
  </script>
</body>
</html>
