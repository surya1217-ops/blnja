<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
GadgetStore Pro - Customer
</title>


<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{

    background:#eef8ff;

    color:#172033;

}

header{

    background:
    linear-gradient(
        135deg,
        #06182c,
        #075da8,
        #5ed5ff
    );

    color:white;

    padding:28px;

    text-align:center;

    box-shadow:
    0 5px 20px #0002;

}

header h1{
    font-size:32px;
}

header p{
    margin-top:7px;
}

.container{

    width:92%;

    max-width:1250px;

    margin:25px auto;

}

.card{

    background:white;

    border-radius:18px;

    padding:25px;

    margin-bottom:25px;

    border:
    1px solid #d8edff;

    box-shadow:
    0 8px 25px #0878c522;

}

.topbar{

    display:flex;

    justify-content:
    space-between;

    align-items:center;

    gap:15px;

    flex-wrap:wrap;

}

h2{

    color:#075da8;

    margin-bottom:15px;

}

button{

    border:0;

    padding:12px 18px;

    border-radius:10px;

    cursor:pointer;

    font-weight:bold;

    color:white;

    background:#0878d1;

    margin:3px;

}

button:hover{
    transform:translateY(-2px);
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.success{
    background:#08a66a;
}

.delete{
    background:#ef4444;
}

.back{
    background:#475569;
}

.orange{
    background:#f59e0b;
}

.product-grid{

    display:grid;

    grid-template-columns:
    repeat(2,minmax(0,1fr));

    gap:20px;

}

.product{

    border:
    1px solid #d9ecfa;

    border-radius:15px;

    overflow:hidden;

    background:white;

    transition:.2s;

}

.product:hover{

    transform:
    translateY(-3px);

    box-shadow:
    0 10px 25px #0878c522;

}

.product img{

    width:100%;

    height:220px;

    object-fit:cover;

    background:#e2e8f0;

}

.product-body{

    padding:17px;

}

.price{

    color:#0878d1;

    font-size:21px;

    font-weight:bold;

    margin:8px 0;

}

.stock{

    display:inline-block;

    padding:5px 10px;

    border-radius:7px;

    background:#e0f2fe;

    color:#0369a1;

    font-size:12px;

    font-weight:bold;

}

.stock-empty{

    background:#fee2e2;

    color:#b91c1c;

}

.desc{

    color:#64748b;

    line-height:1.5;

    margin:10px 0;

}

.product video{

    width:100%;

    margin-top:10px;

    border-radius:8px;

    background:#000;

}


/* ORDER */

.order{

    border:
    1px solid #dcebf5;

    border-radius:15px;

    padding:18px;

    margin:12px 0;

    background:#fbfdff;

}

.order h3{

    color:#075da8;

    margin-bottom:10px;

}

.order p{

    margin:7px 0;

}

.status{

    display:inline-block;

    padding:7px 12px;

    border-radius:20px;

    font-weight:bold;

    font-size:13px;

}

.status-unpaid{

    background:#fff7ed;

    color:#c2410c;

}

.status-paid{

    background:#dcfce7;

    color:#15803d;

}

.status-packing{

    background:#dbeafe;

    color:#1d4ed8;

}

.status-shipped{

    background:#ede9fe;

    color:#6d28d9;

}


/* TRACKING */

.tracking{

    display:flex;

    align-items:center;

    margin:20px 0;

    overflow-x:auto;

}

.step{

    text-align:center;

    min-width:85px;

    color:#94a3b8;

}

.circle{

    width:40px;

    height:40px;

    margin:auto;

    border-radius:50%;

    background:#e2e8f0;

    display:flex;

    align-items:center;

    justify-content:center;

}

.step.active{

    color:#0878d1;

    font-weight:bold;

}

.step.active .circle{

    background:#0878d1;

    color:white;

}

.step.done{

    color:#08a66a;

    font-weight:bold;

}

.step.done .circle{

    background:#08a66a;

    color:white;

}

.line{

    height:4px;

    background:#e2e8f0;

    flex:1;

    min-width:30px;

}

.line.done{

    background:#08a66a;

}


/* LOGIN */

.modal{

    position:fixed;

    inset:0;

    background:#06182ccc;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

    z-index:999;

}

.modal-box{

    background:white;

    width:100%;

    max-width:430px;

    padding:28px;

    border-radius:20px;

    box-shadow:
    0 20px 60px #0005;

}

input,
select{

    width:100%;

    padding:13px;

    border:
    1px solid #cbd5e1;

    border-radius:10px;

    margin:
    7px 0 15px;

    outline:none;

}

.info{

    background:#e0f2fe;

    color:#075da8;

    padding:12px;

    border-radius:10px;

    margin-bottom:15px;

}

.empty{

    text-align:center;

    padding:30px;

    color:#64748b;

}

.hidden{
    display:none!important;
}


@media(max-width:700px){

    .product-grid{

        grid-template-columns:1fr;

    }

    header h1{

        font-size:24px;

    }

}

</style>

</head>


<body>


<header>

<h1>
🛍️ GadgetStore Pro
</h1>

<p>
Belanja Gadget Mudah & Terpercaya
</p>

</header>


<div class="container">


<!-- USER -->

<div class="card">

<div class="topbar">

<div>

<h2>
👋 Halo,
<span id="customerName">
Customer
</span>
</h2>

<p id="loginInfo">
Silakan login untuk membeli produk.
</p>

</div>


<div>

<button
    onclick="openLogin()"
>

🔐 Login

</button>


<button
    class="back"
    onclick="location.href='admin.html'"
>

⚙️ Admin

</button>


<button
    class="delete"
    onclick="logoutCustomer()"
>

Keluar

</button>

</div>

</div>

</div>


<!-- PRODUK -->

<div class="card">

<h2>
📦 Produk Gadget
</h2>

<div
    id="productList"
    class="product-grid"
></div>

</div>


<!-- PESANAN -->

<div class="card">

<h2>
🚚 Pesanan Saya
</h2>

<div
    id="orderList"
></div>

</div>


</div>


<!-- LOGIN -->

<div
    id="loginModal"
    class="modal hidden"
>

<div class="modal-box">

<h2>
🔐 Login Customer
</h2>


<div class="info">

Customer bebas membuat username
dan password sendiri.

</div>


<label>
Username
</label>

<input
    type="text"
    id="customerUsername"
    placeholder="Masukkan username"
>


<label>
Password
</label>

<input
    type="password"
    id="customerPassword"
    placeholder="Masukkan password"
>


<button
    class="success"
    onclick="loginCustomer()"
>

🔐 Login

</button>


<button
    onclick="registerCustomer()"
>

📝 Daftar

</button>


<button
    class="back"
    onclick="closeLogin()"
>

Batal

</button>

</div>

</div>


<script>

/* =====================================================
DATABASE HARUS SAMA PERSIS DENGAN ADMIN
===================================================== */

const DB_NAME =
"GadgetStoreProDatabase";

const DB_VERSION = 1;

const PRODUCT_STORE =
"products";


let db = null;

let objectUrls = [];


/* =====================================================
OPEN DATABASE
===================================================== */

function openDatabase(){

    return new Promise(
        (resolve,reject)=>{

            const request =
            indexedDB.open(
                DB_NAME,
                DB_VERSION
            );


            request.onupgradeneeded =
            function(event){

                const database =
                event.target.result;


                if(
                    !database.objectStoreNames.contains(
                        PRODUCT_STORE
                    )
                ){

                    database.createObjectStore(
                        PRODUCT_STORE,
                        {
                            keyPath:"id"
                        }
                    );

                }

            };


            request.onsuccess =
            function(event){

                db =
                event.target.result;

                resolve(db);

            };


            request.onerror =
            function(){

                reject(
                    request.error
                );

            };

        }
    );

}


/* =====================================================
GET PRODUCTS
===================================================== */

function getProducts(){

    return new Promise(
        (resolve,reject)=>{

            const transaction =
            db.transaction(
                PRODUCT_STORE,
                "readonly"
            );


            const request =
            transaction
            .objectStore(
                PRODUCT_STORE
            )
            .getAll();


            request.onsuccess =
            function(){

                resolve(
                    request.result || []
                );

            };


            request.onerror =
            function(){

                reject(
                    request.error
                );

            };

        }
    );

}


/* =====================================================
SAVE PRODUCT
===================================================== */

function saveProduct(product){

    return new Promise(
        (resolve,reject)=>{

            const transaction =
            db.transaction(
                PRODUCT_STORE,
                "readwrite"
            );


            transaction
            .objectStore(
                PRODUCT_STORE
            )
            .put(product);


            transaction.oncomplete =
            resolve;


            transaction.onerror =
            function(){

                reject(
                    transaction.error
                );

            };

        }
    );

}


/* =====================================================
LOGIN CUSTOMER
===================================================== */

function openLogin(){

    document
    .getElementById(
        "loginModal"
    )
    .classList
    .remove("hidden");

}


function closeLogin(){

    document
    .getElementById(
        "loginModal"
    )
    .classList
    .add("hidden");

}


/* =====================================================
REGISTER
===================================================== */

function registerCustomer(){

    const username =
    document
    .getElementById(
        "customerUsername"
    )
    .value
    .trim();


    const password =
    document
    .getElementById(
        "customerPassword"
    )
    .value;


    if(
        !username ||
        !password
    ){

        alert(
            "Username dan password wajib diisi!"
        );

        return;

    }


    let users =
    JSON.parse(
        localStorage.getItem(
            "customerUsers"
        ) || "[]"
    );


    if(
        users.some(
            user =>
            user.username ===
            username
        )
    ){

        alert(
            "Username sudah digunakan!"
        );

        return;

    }


    users.push({

        username:
        username,

        password:
        password

    });


    localStorage.setItem(
        "customerUsers",
        JSON.stringify(
            users
        )
    );


    localStorage.setItem(
        "customerUser",
        username
    );


    closeLogin();

    updateUser();

    renderOrders();


    alert(
        "Akun customer berhasil dibuat!"
    );

}


/* =====================================================
LOGIN
===================================================== */

function loginCustomer(){

    const username =
    document
    .getElementById(
        "customerUsername"
    )
    .value
    .trim();


    const password =
    document
    .getElementById(
        "customerPassword"
    )
    .value;


    const users =
    JSON.parse(
        localStorage.getItem(
            "customerUsers"
        ) || "[]"
    );


    const user =
    users.find(
        u =>
        u.username ===
        username &&
        u.password ===
        password
    );


    if(!user){

        alert(
            "Username atau password salah!"
        );

        return;

    }


    localStorage.setItem(
        "customerUser",
        username
    );


    closeLogin();

    updateUser();

    renderOrders();


    alert(
        "Login customer berhasil!"
    );

}


/* =====================================================
LOGOUT
===================================================== */

function logoutCustomer(){

    localStorage.removeItem(
        "customerUser"
    );


    updateUser();

    renderOrders();

}


/* =====================================================
USER UI
===================================================== */

function updateUser(){

    const username =
    localStorage.getItem(
        "customerUser"
    );


    document
    .getElementById(
        "customerName"
    )
    .textContent =
    username ||
    "Customer";


    document
    .getElementById(
        "loginInfo"
    )
    .textContent =
    username
    ?
    "Login sebagai: " + username
    :
    "Silakan login untuk membeli produk.";

}


/* =====================================================
RUPIAH
===================================================== */

function rupiah(number){

    return new Intl.NumberFormat(
        "id-ID",
        {
            style:"currency",
            currency:"IDR",
            maximumFractionDigits:0
        }
    ).format(
        Number(number) || 0
    );

}


/* =====================================================
ESCAPE
===================================================== */

function escapeHTML(text){

    return String(text ?? "")
    .replace(
        /[&<>"']/g,
        function(char){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[char];

        }
    );

}


/* =====================================================
RENDER PRODUCT
===================================================== */

async function renderProducts(){

    const container =
    document
    .getElementById(
        "productList"
    );


    const products =
    await getProducts();


    objectUrls.forEach(
        url =>
        URL.revokeObjectURL(
            url
        )
    );


    objectUrls = [];


    if(
        products.length === 0
    ){

        container.innerHTML =
        `
        <div class="empty">

            📦 Belum ada produk.

        </div>
        `;

        return;

    }


    container.innerHTML = "";


    products.forEach(
        product => {

            let imageURL = "";


            if(
                product.imageBlob
            ){

                imageURL =
                URL.createObjectURL(
                    product.imageBlob
                );


                objectUrls.push(
                    imageURL
                );

            }


            let videoURL = "";


            if(
                product.videoBlob
            ){

                videoURL =
                URL.createObjectURL(
                    product.videoBlob
                );


                objectUrls.push(
                    videoURL
                );

            }


            const card =
            document.createElement(
                "div"
            );


            card.className =
            "product";


            card.innerHTML = `

            <img
                src="${imageURL}"
                alt="${escapeHTML(
                    product.name
                )}"
            >


            <div class="product-body">

                <h3>

                    ${escapeHTML(
                        product.name
                    )}

                </h3>


                <div class="price">

                    ${rupiah(
                        product.price
                    )}

                </div>


                <span
                    class="${
                        product.stock > 0
                        ?
                        "stock"
                        :
                        "stock stock-empty"
                    }"
                >

                    ${
                        product.stock > 0
                        ?
                        "Stok: "+product.stock
                        :
                        "Stok Habis"
                    }

                </span>


                <p class="desc">

                    ${escapeHTML(
                        product.desc
                    )}

                </p>


                ${
                    videoURL
                    ?
                    `
                    <video
                        controls
                        src="${videoURL}"
                    ></video>
                    `
                    :
                    ""
                }


                <br>


                <button
                    class="success"
                    ${
                        product.stock <= 0
                        ?
                        "disabled"
                        :
                        ""
                    }
                    onclick="
                    buyProduct(
                        ${product.id}
                    )
                    "
                >

                    🛒 Beli Sekarang

                </button>

            </div>

            `;


            container.appendChild(
                card
            );

        }
    );

}


/* =====================================================
BUY PRODUCT
===================================================== */

async function buyProduct(id){

    const username =
    localStorage.getItem(
        "customerUser"
    );


    if(!username){

        openLogin();


        alert(
            "Silakan login sebagai customer terlebih dahulu."
        );


        return;

    }


    const products =
    await getProducts();


    const product =
    products.find(
        p =>
        p.id === id
    );


    if(!product)
    return;


    if(
        product.stock <= 0
    ){

        alert(
            "Stok produk habis!"
        );

        return;

    }


    const quantity =
    Number(
        prompt(
            "Jumlah yang ingin dibeli:",
            "1"
        )
    );


    if(
        !Number.isInteger(
            quantity
        ) ||
        quantity < 1
    ){

        return;

    }


    if(
        quantity >
        product.stock
    ){

        alert(
            "Stok tidak mencukupi!\n\n"+
            "Stok tersedia: "+
            product.stock
        );

        return;

    }


    const total =
    product.price *
    quantity;


    const payment =
    confirm(
        "Total pembayaran:\n\n"+
        rupiah(total)+
        "\n\n"+
        "Klik OK untuk membayar sekarang."
    );


    if(!payment){

        alert(
            "Pesanan dibatalkan."
        );

        return;

    }


    /* STOK BERKURANG */

    product.stock -=
    quantity;


    await saveProduct(
        product
    );


    /* BUAT ORDER */

    const orders =
    JSON.parse(
        localStorage.getItem(
            "orders"
        ) || "[]"
    );


    const order = {

        id:
        Date.now(),

        customer:
        username,

        productId:
        product.id,

        productName:
        product.name,

        quantity:
        quantity,

        price:
        product.price,

        total:
        total,

        payment:
        "Sudah Dibayar",

        status:
        "Sudah Dibayar",

        date:
        new Date()
        .toLocaleString(
            "id-ID"
        )

    };


    orders.push(
        order
    );


    localStorage.setItem(
        "orders",
        JSON.stringify(
            orders
        )
    );


    alert(
        "✅ Pembayaran berhasil!\n\n"+
        "Produk: "+
        product.name+
        "\nJumlah: "+
        quantity+
        "\nTotal: "+
        rupiah(total)+
        "\n\n"+
        "Pesanan sekarang berstatus: Sudah Dibayar"
    );


    renderProducts();

    renderOrders();

}


/* =====================================================
STATUS
===================================================== */

function statusNumber(status){

    return {

        "Belum Dibayar":1,

        "Sudah Dibayar":2,

        "Sedang Dikemas":3,

        "Sudah Dikirim":4

    }[status] || 1;

}


function statusClass(status){

    if(
        status ===
        "Sudah Dibayar"
    )
    return "status-paid";


    if(
        status ===
        "Sedang Dikemas"
    )
    return "status-packing";


    if(
        status ===
        "Sudah Dikirim"
    )
    return "status-shipped";


    return "status-unpaid";

}


/* =====================================================
TRACKING
===================================================== */

function trackingHTML(status){

    const current =
    statusNumber(
        status
    );


    const steps = [

        ["💰","Belum<br>Dibayar"],

        ["✅","Sudah<br>Dibayar"],

        ["📦","Sedang<br>Dikemas"],

        ["🚚","Sudah<br>Dikirim"]

    ];


    return steps
    .map(
        (step,index) => {

            const number =
            index + 1;


            let cls = "";


            if(
                number <
                current
            ){

                cls =
                "done";

            }

            else if(
                number ===
                current
            ){

                cls =
                "active";

            }


            return `

            <div
                class="
                step
                ${cls}
                "
            >

                <div class="circle">

                    ${step[0]}

                </div>


                <small>

                    ${step[1]}

                </small>

            </div>


            ${
                index < 3
                ?
                `
                <div
                    class="
                    line
                    ${
                        current >=
                        number + 1
                        ?
                        "done"
                        :
                        ""
                    }
                    "
                ></div>
                `
                :
                ""
            }

            `;

        }
    )
    .join("");

}


/* =====================================================
RENDER ORDERS
===================================================== */

function renderOrders(){

    const container =
    document
    .getElementById(
        "orderList"
    );


    const username =
    localStorage.getItem(
        "customerUser"
    );


    if(!username){

        container.innerHTML =
        `
        <div class="empty">

            🔐 Silakan login customer
            untuk melihat pesanan.

        </div>
        `;

        return;

    }


    const allOrders =
    JSON.parse(
        localStorage.getItem(
            "orders"
        ) || "[]"
    );


    const orders =
    allOrders.filter(
        order =>
        order.customer ===
        username
    );


    if(
        orders.length === 0
    ){

        container.innerHTML =
        `
        <div class="empty">

            📦 Belum ada pesanan.

        </div>
        `;

        return;

    }


    container.innerHTML =
    orders
    .slice()
    .reverse()
    .map(
        order => {

            let message =
            "";


            if(
                order.status ===
                "Belum Dibayar"
            ){

                message =
                "💰 Menunggu pembayaran.";

            }

            else if(
                order.status ===
                "Sudah Dibayar"
            ){

                message =
                "✅ Pembayaran berhasil diterima.";

            }

            else if(
                order.status ===
                "Sedang Dikemas"
            ){

                message =
                "📦 Pesanan sedang dikemas oleh admin.";

            }

            else if(
                order.status ===
                "Sudah Dikirim"
            ){

                message =
                "🚚 Pesanan sudah dikirim/diantar.";

            }


            return `

            <div class="order">

                <h3>

                    📦
                    ${escapeHTML(
                        order.productName
                    )}

                </h3>


                <p>

                    <b>
                        Jumlah:
                    </b>

                    ${order.quantity}

                </p>


                <p>

                    <b>
                        Harga:
                    </b>

                    ${rupiah(
                        order.price
                    )}

                </p>


                <p>

                    <b>
                        Total:
                    </b>

                    ${rupiah(
                        order.total
                    )}

                </p>


                <p>

                    <b>
                        Pembayaran:
                    </b>

                    ${escapeHTML(
                        order.payment
                    )}

                </p>


                <p>

                    <b>
                        Tanggal:
                    </b>

                    ${escapeHTML(
                        order.date
                    )}

                </p>


                <p>

                    <b>
                        Status:
                    </b>


                    <span
                        class="
                        status
                        ${statusClass(
                            order.status
                        )}
                    ">

                        ${order.status}

                    </span>

                </p>


                <div class="tracking">

                    ${trackingHTML(
                        order.status
                    )}

                </div>


                <p>

                    <b>
                        📢 Keterangan:
                    </b>

                    ${message}

                </p>


            </div>

            `;

        }
    )
    .join("");

}


/* =====================================================
LOAD
